# site properties and page defaults
title: P4MARS Lab
subtitle: <strong>P</strong>erception and <strong>A</strong>I for <strong>M</strong>anufacturing, <strong>R</strong>obotics, and <strong>S</strong>pace
description: P4MARS is an interdisciplinary research group focused on Perception and AI for Manufacturing, Robotics, and Space.
# header: images/background.jpg
# footer: images/background.jpg
logo-text: true
header-dark: false
footer-dark: false
proofer: false

# site social media and other links
links:
  # email: contact@p4mars.com
  # orcid: 0000-0001-8713-9213
  # google-scholar: ETJoidYAAAAJ
  github: github.com/p4mars
  # twitter: p4mars
  # youtube: p4mars

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
